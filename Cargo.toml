[package]
name = "power-mode-tray"
version = "2.2.0"
edition = "2021"
description = "Windows 11 の電源モードをトレイアイコンのクリックやホットキーで切り替える最小アプリ"
license = "MIT"
repository = "https://github.com/9enki/power-mode-tray"
publish = false

[[bin]]
name = "PowerModeTray"
path = "src/main.rs"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
